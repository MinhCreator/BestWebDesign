<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endurance Hub — Project Workflow</title>
<script>
  (function () {
    const saved = localStorage.getItem('theme');
    const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', dark);
  })();
</script>
<style>
  :root {
    --bg: #FAF9F5; --surface: #FFFFFF; --surface2: #F0EEE6;
    --ink: #141413; --body: #3D3D3A; --muted: #87867F;
    --line: #D1CFC5; --line-soft: #E6E3DA;
    --clay: #D97757; --clay-soft: rgba(217,119,87,0.10);
    --olive: #788C5D; --olive-soft: rgba(120,140,93,0.12);
    --gold: #C9A45C; --gold-soft: rgba(201,164,92,0.12);
    --blue: #5B7E96; --blue-soft: rgba(91,126,150,0.10);
    --red: #B04A3F; --red-soft: rgba(176,74,63,0.10);
    --green: #5B8C5A; --green-soft: rgba(91,140,90,0.10);
    --pine: #1B4332; --pine-soft: rgba(27,67,50,0.10);
    --zone: rgba(20,20,19,0.025); --zone-line: #D1CFC5;
    --serif: ui-serif, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html.dark {
    --bg: #141413; --surface: #1F1F1D; --surface2: #2A2A28;
    --ink: #FAF9F5; --body: #D1CFC5; --muted: #87867F;
    --line: #3D3D3A; --line-soft: #2A2A28;
    --clay: #E48A6E; --clay-soft: rgba(228,138,110,0.14);
    --olive: #9DB07C; --olive-soft: rgba(157,176,124,0.16);
    --gold: #D4B36F; --gold-soft: rgba(212,179,111,0.14);
    --blue: #7FA3BC; --blue-soft: rgba(127,163,188,0.12);
    --red: #D46B5E; --red-soft: rgba(212,107,94,0.14);
    --green: #7DAF7C; --green-soft: rgba(125,175,124,0.14);
    --pine: #56B685; --pine-soft: rgba(86,182,133,0.14);
    --zone: rgba(250,249,245,0.03); --zone-line: #3D3D3A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--body); font-family: var(--sans);
    -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden;
  }

  .bar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 1px solid var(--line-soft); flex: none;
  }
  .bar h1 { font-family: var(--serif); font-weight: 500; font-size: 19px; color: var(--ink); letter-spacing: -0.01em; }
  .bar .sub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .spacer { flex: 1; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em;
    padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px;
    background: transparent; color: var(--muted); cursor: pointer; transition: all .15s ease;
  }
  .chip:hover { color: var(--ink); border-color: var(--muted); }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  #themeToggle {
    font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
    padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: transparent; color: var(--muted); cursor: pointer;
  }
  #themeToggle:hover { color: var(--ink); border-color: var(--muted); }

  .stage { flex: 1; position: relative; min-height: 0; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .zone rect { fill: var(--zone); stroke: var(--zone-line); stroke-width: 1; stroke-dasharray: 5 5; rx: 16; }
  .zone .ztitle { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; fill: var(--muted); }
  .zone .zsub { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); opacity: 0.75; }

  .node { cursor: pointer; }
  .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; rx: 10; transition: stroke .15s ease, filter .15s ease; }
  .node:hover rect { stroke: var(--muted); }
  .node.sel rect { stroke: var(--clay) !important; stroke-width: 2; }
  .node .t  { font-family: var(--sans); font-size: 14px; font-weight: 600; fill: var(--ink); pointer-events: none; }
  .node .m  { font-family: var(--mono); font-size: 11px; fill: var(--muted); pointer-events: none; }
  .node .k  { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--clay); pointer-events: none; }
  .node.gate rect { fill: var(--clay-soft); stroke: var(--clay); }
  .node.store rect { fill: var(--surface2); }
  .node.do rect { fill: var(--olive-soft); stroke: var(--olive); }
  .node.ext rect { stroke-dasharray: 6 3; }
  .node.auth rect { fill: var(--gold-soft); stroke: var(--gold); }
  .node.api rect { fill: var(--blue-soft); stroke: var(--blue); }
  .node.bad rect { fill: var(--red-soft); stroke: var(--red); }
  .node.primary rect { fill: var(--pine-soft); stroke: var(--pine); }

  .edge { stroke: var(--muted); stroke-width: 1.6; fill: none; marker-end: url(#a-mut); transition: opacity .2s ease, stroke .2s ease; }
  .edge.dash { stroke-dasharray: 5 4; }
  .edge.ws { stroke-width: 2; }
  .elbl { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); transition: opacity .2s ease; }

  .stage.flowing .edge { opacity: 0.13; }
  .stage.flowing .elbl { opacity: 0.13; }
  .stage.flowing .node { opacity: 0.30; }
  .stage.flowing .zone { opacity: 0.45; }
  .stage.flowing .edge.lit {
    opacity: 1; stroke: var(--clay); marker-end: url(#a-clay);
    stroke-dasharray: 7 5; animation: march 0.9s linear infinite;
  }
  .stage.flowing .edge.lit.alt { stroke: var(--blue); marker-end: url(#a-blue); }
  .stage.flowing .edge.lit.alt2 { stroke: var(--olive); marker-end: url(#a-olive); }
  .stage.flowing .edge.lit.alt3 { stroke: var(--gold); marker-end: url(#a-gold); }
  .stage.flowing .edge.lit.alt4 { stroke: var(--pine); marker-end: url(#a-pine); }
  .stage.flowing .elbl.lit { opacity: 1; fill: var(--clay); }
  .stage.flowing .elbl.lit.alt { fill: var(--blue); }
  .stage.flowing .elbl.lit.alt2 { fill: var(--olive); }
  .stage.flowing .elbl.lit.alt3 { fill: var(--gold); }
  .stage.flowing .elbl.lit.alt4 { fill: var(--pine); }
  .stage.flowing .node.lit { opacity: 1; }
  .stage.flowing .node.lit rect { stroke: var(--clay); }
  .stage.flowing .node.lit.alt rect { stroke: var(--blue); }
  .stage.flowing .node.lit.alt2 rect { stroke: var(--olive); }
  .stage.flowing .node.lit.alt3 rect { stroke: var(--gold); }
  .stage.flowing .node.lit.alt4 rect { stroke: var(--pine); }
  @keyframes march { to { stroke-dashoffset: -12; } }
  @media (prefers-reduced-motion: reduce) { .stage.flowing .edge.lit { animation: none; } }

  .card {
    position: absolute; max-width: 360px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; box-shadow: 0 6px 24px rgba(0,0,0,0.08);
  }
  #detail { right: 16px; bottom: 16px; width: 340px; }
  #detail h3 { font-family: var(--serif); font-weight: 500; font-size: 17px; color: var(--ink); margin-bottom: 2px; }
  #detail .meta { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-bottom: 8px; }
  #detail p { font-size: 12.5px; line-height: 1.55; }
  #detail p code, #flowcap code { font-family: var(--mono); font-size: 11px; color: var(--clay); }
  #flowcap { left: 16px; bottom: 16px; max-width: 460px; display: none; }
  #flowcap.show { display: block; }
  #flowcap .fname { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--clay); margin-bottom: 6px; }
  #flowcap ol { margin-left: 18px; }
  #flowcap li { font-size: 12.5px; line-height: 1.55; }

  @media (max-width: 880px) {
    body { overflow: auto; }
    .stage { min-height: 70vh; }
    #detail { position: static; width: auto; margin: 10px 16px; }
    #flowcap { position: static; margin: 0 16px 16px; }
  }
</style>
</head>
<body>

<div class="bar">
  <div>
    <h1>ENDURANCE|HUB — project workflow</h1>
    <div class="sub">React 18 · Vite 8 · Tailwind v4 · DaisyUI · Vercel proxy · Private backend</div>
  </div>
  <div class="spacer"></div>
  <div class="chips" id="chips">
    <button class="chip on" data-flow="all">Everything</button>
    <button class="chip" data-flow="home">Home Browse</button>
    <button class="chip" data-flow="register">Register</button>
    <button class="chip" data-flow="login">Admin Login</button>
    <button class="chip" data-flow="dashboard">Admin Dashboard</button>
    <button class="chip" data-flow="events">Event Management</button>
    <button class="chip" data-flow="news">News Feed</button>
  </div>
  <button id="themeToggle">Theme</button>
</div>

<div class="stage" id="stage">

  <defs>

      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--gold)"/>
    </marker>
    <marker id="a-pine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--pine)"/>
    </marker>
  </defs>

  <!-- ── zones ─────────────────────────────── -->
  <g class="zone" id="z-browser">
    <rect x="40" y="120" width="280" height="720"/>

  <g class="zone" id="z-vercel">

  <path class="edge" id="e-admin-dash"    d="M295,670 C 330,670 345,675 375,675"/>

  <text class="elbl" data-e="e-content-fwd" x="780" y="486">GET /api/admin/articles</text>

<script>
const DETAIL = {
  browser:       { t:"Browser", m:"client · React 18 SPA", b:"React 18 with Vite 8. Uses <code>@tanstack/react-query</code> for data fetching. All API calls use relative <code>/api/*</code> paths. Tailwind CSS v4 with DaisyUI for theming. Portal view at port 2007." },
  layout:        { t:"Public Layout", m:"Layout.jsx · common shell", b:"Wraps all public pages: <code>Navbar</code> + <code>BubbleNavbar</code> + <code>&lt;Outlet /&gt;</code> + <code>Footer</code>. Handles responsive mobile menu with hamburger toggle." },
  "register-modal": { t:"Register Modal", m:"Register.jsx · direct fetch", b:"Opens when user clicks 'Register' on an event. POSTs directly to <code>/api/register</code> with <code>{name, phone, event}</code>. Does NOT go through the admin API service — raw fetch." },
  "login-page":  { t:"Admin Login Page", m:"/admin/login", b:"Collects username + password. Calls <code>AuthContext.login()</code> → <code>adminApi.adminLogin()</code> → <code>POST /api/admin/login</code>. On success stores token + user in localStorage and redirects to <code>/admin/dashboard</code>. On error shows message." },
  "admin-pages": { t:"Admin Pages", m:"6 pages under /admin/*", b:"<b>Dashboard</b> — stats cards + cache status<br><b>Registrations</b> — searchable table + delete<br><b>Events</b> — full CRUD with status filter<br><b>Content</b> — view articles + trigger re-crawl<br><b>System Health</b> — endpoint status + clear cache<br><b>Users</b> — list + create (superadmin only)" },
  spa:           { t:"Static Assets", m:"Vite build output", b:"<code>npm run build</code> → <code>vite build</code> produces static bundle. Deployed to Vercel. All <code>/api/*</code> requests rewritten to the serverless proxy via <code>vercel.json</code>." },
  "public-routes":{ t:"Public Routes", m:"React Router · Layout wrapper", b:"<b>/</b> — Home (Hero, RaceSlider, Community, Training)<br><b>/News</b> — MainContent (mock data) + SideContent (useArticles hook)<br><b>/Event</b> — EventList (useEvents hook) + filter + map<br><b>/Leaderboard</b> — Rank page<br><b>/Team</b> — Team page" },
  "public-hooks":{ t:"Public Hooks", m:"TanStack Query", b:"<code>useArticles</code> — fetches <code>/api/articles</code>, staleTime 5min<br><code>usePosts</code> — fetches <code>/api/posts?start=&amp;end=</code>, paginated<br><code>useEvents</code> — fetches <code>/api/events</code>, staleTime 5min<br><br>All backed by <code>api.js</code> service with <code>BASE_URL = \"\"</code>." },
  "admin-layout":{ t:"Admin Layout", m:"AdminLayout.jsx", b:"Responsive sidebar with navigation links to all admin pages. Shows user avatar, name, and role. Logout button. Mobile overlay. Navigation items: Dashboard, Registrations, Events, Content, System Health. Users shown only for superadmin." },
  "protected-route":{ t:"ProtectedRoute", m:"gate component", b:"<b>The auth gate.</b> Reads token from localStorage via <code>useAuth()</code>.<br>If no token → redirect to <code>/admin/login</code>.<br>If <code>requiredRole === 'superadmin'</code> and user role is 'admin' → shows 'Access denied'." },
  localstorage:  { t:"localStorage", m:"browser storage", b:"Stores <code>admin_token</code> (JWT string) and <code>admin_user</code> (JSON with name, role, username). Persists across reloads. Cleared on 401 response or explicit logout." },
  context:       { t:"AuthContext", m:"React Context", b:"Provides <code>login()</code>, <code>logout()</code>, <code>user</code>, <code>token</code>, <code>loading</code>, <code>isAuthenticated</code>, <code>isAdmin</code>, <code>isSuperAdmin</code>. <code>isSuperAdmin = user?.role === 'superadmin'</code>. Initialized from localStorage on mount." },
  "vercel-proxy":{ t:"Vercel Proxy", m:"api/proxy.js (HANDLER)", b:"<b>The critical bridge.</b> Vercel rewrites <code>/api/(.*)</code> → <code>/api/proxy?path=/api/$1</code>. The proxy:<br>• Reads raw body via <code>req.on('data')</code> (✓ fixed)<br>• Forwards <code>Authorization</code> header (✓ fixed)<br>• Uses <code>process.env.VITE_API_KEY</code> for backend URL<br>• Returns 502 if backend unreachable" },
  "admin-api":   { t:"Admin API Service", m:"adminApi.js", b:"All admin endpoints go through <code>adminRequest()</code> which attaches the Bearer token from localStorage. On 401 → clears storage + redirects to login. Endpoints: login, dashboard, registrations, articles, events (CRUD), users, health, crawl, cache clear." },
  "public-api":  { t:"Public API Service", m:"api.js", b:"Simple fetch wrapper with <code>BASE_URL = \"\"</code>. Three methods: <code>fetchArticles()</code>, <code>fetchPosts(page, limit)</code>, <code>fetchEvents()</code>. All results pass through <code>toArray()</code> — converts object responses to arrays via <code>Object.values()</code>." },
  articles:      { t:"GET /api/articles", m:"news articles", b:"Returns array of articles with image_url, title, date, link. Used by <code>useArticles</code> hook → <code>Post.jsx</code> component in the news sidebar. Empty image_url items replaced with Loading spinner." },
  posts:         { t:"GET /api/posts", m:"paginated blog posts", b:"Accepts <code>?start=&amp;end=</code> query params. Used by <code>usePosts</code> hook → <code>Pagination.jsx</code> on the Home page. Rendered with <code>motion</code> animations (<code>AnimatePresence</code>)." },
  events:        { t:"GET /api/events", m:"upcoming events", b:"Returns events list. Used by <code>useEvents</code> hook → <code>EventList.jsx</code> on the Event page. Supports client-side filtering by type, location, distance." },
  register:      { t:"POST /api/register", m:"registration endpoint", b:"Accepts <code>{name, phone, event}</code>. Called from the <code>Register.jsx</code> modal component via raw <code>fetch</code> — not through any service wrapper. Returns 201 on success." },
  "admin-login-ep":{ t:"POST /api/admin/login", m:"authentication", b:"Validates username + password. Returns <code>{token, user}</code> on success. Token is stored in localStorage and sent as <code>Authorization: Bearer {token}</code> on all subsequent admin requests." },
  "admin-dash-ep":{ t:"GET /api/admin/dashboard", m:"dashboard stats", b:"Returns stats object: articles count, posts count, events count, registrations count, admin_users count, and cache status object. Rendered as stat cards in the admin Dashboard." },
  "admin-reg-ep":{ t:"GET /api/admin/registrations", m:"registration list", b:"Returns registration entries with name, phone, event, timestamp. Supports client-side search by name or phone. Each entry can be deleted." },
  "admin-articles-ep":{ t:"GET /api/admin/articles", m:"article management", b:"Returns all articles for admin viewing. Has endpoint to trigger re-crawl for 'articles' or 'posts' type. Crawl sends POST to <code>/api/admin/crawl/{type}</code>." },
  "admin-events-ep":{ t:"/api/admin/events", m:"CRUD with status filter", b:"Full CRUD: GET (with <code>?status=running|past</code>), POST (create), PUT (update), DELETE. Toggle event status between running/past. Form fields: name, type, location, distance, date, organizer, image, route, status." },
  "admin-users-ep":{ t:"/api/admin/users", m:"superadmin only", b:"Protected by <code>requiredRole='superadmin'</code> in ProtectedRoute. GET lists all admin users. POST creates new admin user with username, password, role (admin/superadmin), display name." },
  "admin-health-ep":{ t:"GET /api/admin/health", m:"system check", b:"Returns endpoint status for all API routes plus cache status. Shows green/red badges per endpoint. Has 'Clear All Cache' button that POSTs to <code>/api/admin/cache/clear</code>." },
  "admin-crawl-ep":{ t:"POST /api/admin/crawl", m:"news scraping", b:"Accepts type param: 'articles' or 'posts'. Triggers backend news scraping/crawling. Called from the Content management page with 'Re-crawl' buttons." },
};

const FLOWS = {
  home: {
    name: "Home Browse — public visit with live data + mock content",
    edges: ["e-spa-load","e-nav-home","e-fetch-art","e-fetch-post","e-fetch-ev","e-proxy-fwd","e-back-resp","e-vercel-resp"],
    nodes: ["browser","layout","public-routes","public-hooks","public-api","vercel-proxy","articles","posts","events"],
    steps: ["User loads app → SPA shell from Vercel edge cache","Navigates to <code>/</code> → Hero, RaceSlider, CommunitySection, TrainingSection render","<code>Pagination.jsx</code> on Home calls <code>usePosts()</code> hook","<code>useArticles</code>, <code>usePosts</code>, <code>useEvents</code> fire via TanStack Query","<code>GET /api/articles</code> / <code>/api/posts</code> / <code>/api/events</code> through proxy","Vercel rewrites <code>/api/(.*)</code> → <code>/api/proxy?path=/api/$1</code>","Proxy reads raw body, forwards <code>Authorization</code>, calls backend","Backend returns JSON → flows back to browser → components render"]
  },
  register: {
    name: "Event Registration — modal form POSTs directly",
    edges: ["e-reg-modal","e-reg-post","e-reg-fwd","e-reg-resp","e-reg-vercel"],
    nodes: ["browser","register-modal","public-api","vercel-proxy","register"],
    steps: ["User clicks 'Register' on an event card → modal opens","Modal form collects name + phone. Event name pre-filled from selected event","<code>fetch('/api/register', { method:'POST', body: JSON })</code> directly (not through adminApi)","Vercel rewrites to proxy — raw body parsed and forwarded","Backend processes registration — returns 201 on success","User sees success confirmation in modal (auto-closes after 3s)"]
  },
  login: {
    name: "Admin Login — token-based auth flow",
    edges: ["e-admin-login","e-login-api","e-login-fwd","e-login-back","e-login-resp","e-auth-store"],
    nodes: ["browser","login-page","context","admin-api","vercel-proxy","admin-login-ep","localstorage"],
    steps: ["Admin enters username + password on <code>/admin/login</code>","<code>AuthContext.login()</code> → <code>adminApi.adminLogin()</code>","<code>POST /api/admin/login</code> with <code>{username, password}</code>","Vercel proxy forwards request — raw body now correctly parsed","Backend validates credentials — returns <code>{token, user}</code>","Token + user saved to <code>localStorage</code> → AuthContext updates","Redirected to <code>/admin/dashboard</code> (or previous location)"]
  },
  dashboard: {
    name: "Admin Dashboard — protected authenticated request",
    edges: ["e-admin-dash","e-dash-api","e-dash-fwd","e-auth-store","e-token-use","e-dash-back","e-dash-resp"],
    nodes: ["browser","admin-pages","admin-layout","protected-route","admin-api","localstorage","vercel-proxy","admin-dash-ep"],
    steps: ["Admin navigates to <code>/admin/dashboard</code>","<code>ProtectedRoute</code> checks localStorage for token — found → renders","<code>AdminLayout</code> renders sidebar with nav items + user avatar","<code>adminApi.getDashboard()</code> called — token attached as <code>Authorization: Bearer</code>","<code>GET /api/admin/dashboard</code> through Vercel proxy","Proxy forwards <code>Authorization</code> header (✓ fixed)","Backend verifies token → returns stats: articles, posts, events, regs, users, cache","Dashboard renders stat cards + cache status table"]
  },
  events: {
    name: "Event Management — admin CRUD",
    edges: ["e-admin-dash","e-dash-api","e-events-fwd","e-events-back"],
    nodes: ["browser","admin-pages","admin-layout","protected-route","admin-api","vercel-proxy","admin-events-ep"],
    steps: ["Admin navigates to <code>/admin/events</code> → ProtectedRoute passes","GET request fetches events with optional <code>?status=running|past</code> filter","CRUD operations: create (POST), edit (PUT), delete (DELETE), toggle status","All requests go through Vercel proxy with Bearer token","Backend processes and returns updated event list"]
  },
  news: {
    name: "News Feed — sidebar uses API, main content uses mock",
    edges: ["e-spa-load","e-nav-home","e-fetch-art","e-proxy-fwd","e-back-resp","e-vercel-resp"],
    nodes: ["browser","layout","public-routes","public-hooks","public-api","vercel-proxy","articles"],
    steps: ["User opens <code>/News</code> page","<code>MainContent.jsx</code> renders — uses <b>hardcoded mock data</b> (not API)","<code>SideContent.jsx</code> renders — has tabs for 'Latest News' and 'Upcoming Races'","'Latest News' tab renders <code>Post.jsx</code> which calls <code>useArticles()</code>","<code>GET /api/articles</code> through proxy → backend","Articles rendered as sidebar list with image thumbnail + title + date"]
  }
};

const stage = document.getElementById('stage');
const nodes = document.querySelectorAll('.node');
const edges = document.querySelectorAll('.edge');
const elbls = document.querySelectorAll('.elbl');
const chips = document.querySelectorAll('.chip');
const fcap = document.getElementById('flowcap');

function setFlow(key) {
  chips.forEach(c => c.classList.toggle('on', c.dataset.flow === key));
  edges.forEach(e => e.classList.remove('lit'));
  elbls.forEach(l => l.classList.remove('lit'));
  nodes.forEach(n => n.classList.remove('lit'));
  if (key === 'all') { stage.classList.remove('flowing'); fcap.classList.remove('show'); return; }
  const f = FLOWS[key];
  if (!f) return;
  stage.classList.add('flowing');
  f.edges.forEach(id => document.getElementById(id)?.classList.add('lit'));
  elbls.forEach(l => { if (f.edges.includes(l.dataset.e)) l.classList.add('lit'); });
  f.nodes.forEach(k => document.querySelector(`.node[data-k="${k}"]`)?.classList.add('lit'));
  document.getElementById('f-name').textContent = f.name;
  document.getElementById('f-steps').innerHTML = f.steps.map(s => `<li>${s}</li>`).join('');
  fcap.classList.add('show');
}
chips.forEach(c => c.addEventListener('click', () => setFlow(c.dataset.flow)));

nodes.forEach(n => n.addEventListener('click', () => {
  nodes.forEach(x => x.classList.remove('sel'));
  n.classList.add('sel');
  const d = DETAIL[n.dataset.k];
  if (!d) return;
  document.getElementById('d-title').textContent = d.t;
  document.getElementById('d-meta').textContent = d.m;
  document.getElementById('d-body').innerHTML = d.b;
}));

document.getElementById('themeToggle').addEventListener('click', () => {
  const dark = !document.documentElement.classList.contains('dark');
  document.documentElement.classList.toggle('dark', dark);
  localStorage.setItem('theme', dark ? 'dark' : 'light');
});
</script>
</body>
