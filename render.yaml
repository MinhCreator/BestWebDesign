services:
  - type: web
    name: bestwebdesign-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: web
    name: bestwebdesign
    env: static
    region: singapore
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://bestwebdesign-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
